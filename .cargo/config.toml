# Cargo build configuration for steelseriesgg-rs
#
# Linker options (pick ONE per target — do not combine):
#
#   mold   — fastest, install: `sudo apt install mold` or `cargo install mold`
#   lld    — LLVM linker, install: `sudo apt install lld`
#   ld.bfd — default GNU linker, no install needed (slowest)
#
# sccache — compilation cache, install: `cargo install sccache`
# Uncomment the rustc-wrapper line below to enable it globally.

[build]
# rustc-wrapper = "sccache"

# No global RUSTFLAGS: the default build must link with the system's stock toolchain and run on
# any x86-64 CPU. A binary built with -Ctarget-cpu=x86-64-v3 dies with SIGILL on CPUs without
# AVX2/FMA/BMI2 (pre-Haswell Intel, many Atom/Celeron/Pentium chips, older AMD).
# For a local build tuned to your own machine only:
# rustflags = ["-Ctarget-cpu=native"]

# ---------------------------------------------------------------------------
# Linux x86_64
# ---------------------------------------------------------------------------
[target.x86_64-unknown-linux-gnu]
# NOTE: a target.<triple>.rustflags key REPLACES [build] rustflags, it does not merge —
# so -Ctarget-cpu=x86-64-v3 must be repeated here or it silently drops for this target.

# mold (fastest): uncomment if installed
# rustflags = ["-Clink-arg=-fuse-ld=mold"]

# lld (fast): uncomment if installed, comment out mold line above. Left off by default because
# linking fails outright ("invalid linker name -fuse-ld=lld") on machines without lld.
# rustflags = ["-Clink-arg=-fuse-ld=lld"]

# native CPU tuning — faster binary, but NOT portable across machines
# rustflags = ["-Ctarget-cpu=native", "-Clink-arg=-fuse-ld=lld"]

# ---------------------------------------------------------------------------
# Linux aarch64 (cross-compile from x86_64)
# Requires: sudo apt install gcc-aarch64-linux-gnu
# ---------------------------------------------------------------------------
[target.aarch64-unknown-linux-gnu]
linker = "aarch64-linux-gnu-gcc"
# rustflags = ["-Clink-arg=-fuse-ld=lld"]

# ---------------------------------------------------------------------------
# Windows x86_64, cross-compile FROM LINUX via MinGW.
# Requires: sudo apt install gcc-mingw-w64-x86-64
# Not used when building natively on Windows — see x86_64-pc-windows-msvc below.
# ---------------------------------------------------------------------------
[target.x86_64-pc-windows-gnu]
# Set only when cross-compiling from Linux; a native windows-gnu host uses its own gcc.
# linker = "x86_64-w64-mingw32-gcc"
# ar = "x86_64-w64-mingw32-ar"

# ---------------------------------------------------------------------------
# Windows x86_64, native build on Windows (MSVC toolchain, rustup default host).
# Uses link.exe from Visual Studio Build Tools — no extra install needed.
# rust-lld is bundled with rustc but opting in needs `-C linker-features=+lld`,
# which is still -Z-gated (checked against rustc 1.97.1: "unstable, requires
# -Z unstable-options" even with RUSTC_BOOTSTRAP=1) — not enabled until stable.
# ---------------------------------------------------------------------------
[target.x86_64-pc-windows-msvc]
# rustflags = ["-Ctarget-cpu=native"]

# ---------------------------------------------------------------------------
# Alias shortcuts
# ---------------------------------------------------------------------------
[alias]
# Build the release binary with all warnings promoted to errors (mirrors CI)
build-ci     = "build --release --locked"
clippy-ci    = "clippy --all-targets --locked -- -D warnings"
fmt-ci       = "fmt --all -- --check"
test-ci      = "test --locked"
fix-ci       = "fix --workspace --allow-no-vcs"

# Build with Sonar integration
build-sonar  = "build --release --locked --features sonar"

# Build with PulseAudio/PipeWire (requires libpulse-dev)
build-audio  = "build --release --locked --features audio"

# Build experimental Apex Pro TKL 2023 per-key RGB support
build-apex23 = "build --release --locked --features experimental-apex-2023"

# No [env] RUSTC_BOOTSTRAP: it switched nightly-only code paths on in every dependency's build
# script, which breaks on compiler updates. Nothing in this project needs unstable features.
